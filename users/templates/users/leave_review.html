{% extends 'users/base.html' %}

{% block content %}
<div class="bg-gray-50 min-h-screen py-12 px-6 flex items-center justify-center">
    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 p-8">
        
        <h2 class="text-2xl font-black text-gray-900 mb-2">Leave a Review</h2>
        <p class="text-gray-500 mb-6">How was your experience with <span class="font-bold text-blue-600 capitalize">{{ booking.professional.user.username }}</span>?</p>
        
        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Rating</label>
                <select name="rating" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 font-bold text-gray-700">
                    <option value="5">⭐⭐⭐⭐⭐ (5) - Excellent</option>
                    <option value="4">⭐⭐⭐⭐ (4) - Great</option>
                    <option value="3">⭐⭐⭐ (3) - Good</option>
                    <option value="2">⭐⭐ (2) - Fair</option>
                    <option value="1">⭐ (1) - Poor</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Your Comment</label>
                <textarea name="comment" rows="4" required placeholder="Tell others about the service you received..." class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none transition text-gray-700 resize-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg">
                Submit Review
            </button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{% url 'user_dashboard' %}" class="text-sm font-bold text-gray-400 hover:text-gray-600">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
