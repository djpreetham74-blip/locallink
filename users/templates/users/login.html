<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LocalLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styling to force Django's auto-generated form to look premium */
        .django-form-container p { margin-bottom: 1.25rem; }
        .django-form-container label { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 0.5rem; }
        .django-form-container input { width: 100%; padding: 0.75rem 1rem; border-radius: 0.5rem; border: 1px solid #E5E7EB; background-color: #F9FAFB; outline: none; transition: all 0.2s ease-in-out; font-size: 0.875rem; }
        .django-form-container input:focus { background-color: #FFFFFF; border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .django-form-container ul.errorlist { color: #DC2626; font-size: 0.875rem; margin-bottom: 1rem; list-style-type: none; padding: 0; background: #FEF2F2; padding: 0.5rem; border-radius: 0.375rem; border: 1px solid #FCA5A5; }
    </style>
</head>
<body class="bg-white font-sans antialiased text-gray-900">

    <div class="flex min-h-screen">
        
        <!-- LEFT SIDE: Brand Anchor -->
        <div class="hidden lg:flex lg:w-5/12 bg-slate-900 relative flex-col justify-between p-12 overflow-hidden">
            <!-- Background Decorative Blob -->
            <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl"></div>
                <div class="absolute bottom-10 right-10 w-72 h-72 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl"></div>
            </div>

            <!-- Logo -->
            <div class="relative z-10">
                <a href="{% url 'home' %}" class="text-3xl font-black tracking-tight text-white hover:opacity-80 transition">
                    Local<span class="text-blue-500">Link</span>
                </a>
            </div>

            <!-- Value Proposition -->
            <div class="relative z-10 mb-20">
                <h2 class="text-4xl font-extrabold text-white mb-6 leading-tight">Welcome back.</h2>
                <p class="text-lg text-slate-400 max-w-md leading-relaxed">Sign in to manage your bookings, message clients, and explore top-tier professionals in your area.</p>
            </div>
            
            <div class="relative z-10 text-slate-500 text-sm">
                &copy; 2026 LocalLink Technologies
            </div>
        </div>

        <!-- RIGHT SIDE: The Form -->
        <div class="w-full lg:w-7/12 flex items-center justify-center p-8 sm:p-12">
            <div class="w-full max-w-sm">
                
                <!-- Mobile Logo -->
                <div class="lg:hidden text-center mb-8">
                    <a href="{% url 'home' %}" class="text-3xl font-black tracking-tight text-blue-600">Local<span class="text-gray-900">Link</span></a>
                </div>

                <div class="mb-10 text-center lg:text-left">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">Sign in to your account</h1>
                    <p class="text-gray-500">Enter your credentials below.</p>
                </div>

                <form method="POST" action="{% url 'login' %}" class="space-y-6">
                    {% csrf_token %}

                    <div class="django-form-container">
                        {{ form.as_p }}
                    </div>

                    <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3.5 rounded-lg shadow-[0_4px_14px_0_rgba(0,0,0,0.1)] transition-all mt-4 text-sm tracking-wide">
                        Sign In →
                    </button>
                    
                    <p class="text-center text-sm text-gray-500 mt-8">
                        Don't have an account? <a href="{% url 'signup' %}" class="font-bold text-blue-600 hover:text-blue-800 transition">Sign up</a>
                    </p>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
